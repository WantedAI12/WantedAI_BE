# 운영 프로필(BE-082). SPRING_PROFILES_ACTIVE=prod로 켠다.
#
# application.yaml의 개발 편의용 기본값(JWT_SECRET 하드코딩 문자열, DB_USERNAME/PASSWORD=root)을
# 여기서는 일부러 두지 않는다 - 실제 값이 환경변수로 주어지지 않으면 이 자리표시자를 못 채워
# Spring이 기동 자체를 실패시킨다("Could not resolve placeholder"). 운영에 개발용 비밀값이나
# 기본 DB 계정이 그대로 켜지는 사고를 막기 위한 의도적인 설계다.
spring:
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 운영에서는 스키마를 암묵적으로 바꾸지 않는다 - 엔티티와 실제 스키마가 어긋나면
      # (마이그레이션을 안 돌렸다는 뜻이므로) 조용히 ALTER 하는 대신 기동을 실패시킨다.
      # 이 검증이 유효하려면 별도 DB 마이그레이션 도구(BE-083, 미도입)로 스키마를 관리해야 한다.
      ddl-auto: validate
    show-sql: false

jwt:
  secret: ${JWT_SECRET}

# 운영 프런트엔드 도메인을 명시적으로 주입하도록 강제한다(BE-081). 기본값을 두면 개발용
# localhost가 그대로 켜져 아무 요청도 못 받거나, 안일하게 "*"를 넣어 모든 오리진을 여는
# 사고로 이어지기 쉽다 - 실제 배포 도메인이 정해지면 그 값을 환경변수로 주입한다.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# 운영에서는 인증 여부와 무관하게 헬스체크 상세 정보(DB 연결 정보 등)를 절대 노출하지
# 않는다(BE-089) - 기본 프로필의 when-authorized보다 한 단계 더 보수적으로 강제한다.
management:
  endpoint:
    health:
      show-details: never
