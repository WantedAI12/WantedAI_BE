spring:
  datasource:
    url: jdbc:h2:mem:perfumery;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  # 이 파일이 테스트 클래스패스에서 메인 application.yaml을 완전히 대체하므로, 명시적으로
  # 꺼두지 않으면 Flyway가 기본값(true)으로 켜져 ddl-auto: create-drop과 충돌한다 - 테스트는
  # 항상 Hibernate가 스키마를 만들게 한다(운영 프로필에서만 Flyway를 쓴다는 원칙과 동일).
  flyway:
    enabled: false

jwt:
  secret: test-only-secret-value-that-is-definitely-longer-than-32-bytes-000
  access-token-validity-seconds: 3600
  refresh-token-validity-seconds: 1209600

security:
  login:
    max-attempts: 5
    lockout-duration-seconds: 900

cors:
  allowed-origins: http://localhost:3000,http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info

ai:
  modal:
    base-url: http://localhost:0
    auth-token: ""
    connect-timeout: 1s
    response-timeout: 2s
    requests-per-minute: 30
    max-retries: 1

aws:
  s3:
    bucket: test-bucket
    region: ap-northeast-2
  ses:
    region: ap-northeast-2
    sender-email: no-reply@test.local

app:
  frontend-base-url: http://localhost:3000
