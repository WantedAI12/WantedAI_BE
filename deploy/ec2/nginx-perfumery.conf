# /etc/nginx/conf.d/perfumery.conf
# Cloudflare(프록시) -> nginx:443 -> Spring Boot 127.0.0.1:8080
# 보안 그룹이 443을 Cloudflare IP 대역에만 열어두므로 여기서는 TLS 종료와 프록시만 담당한다.
# 인증서: Cloudflare Origin CA 인증서를 /etc/nginx/tls/origin.{crt,key}에 둔다.

# Cloudflare가 넘겨주는 실제 클라이언트 IP 복원 (https://www.cloudflare.com/ips-v4)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

server {
	listen 443 ssl;
	http2 on;
	server_name api.perfumery.studio;

	ssl_certificate     /etc/nginx/tls/origin.crt;
	ssl_certificate_key /etc/nginx/tls/origin.key;
	ssl_protocols TLSv1.2 TLSv1.3;

	# application.yaml의 multipart 한도(5MB)보다 약간 크게
	client_max_body_size 6m;

	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto https;
		# AI 호출 응답 대기(ai.modal.response-timeout 305s + 여유 5s = 310s)보다 길게.
		# 2026-09-16 response-timeout을 130s->305s로 올렸을 때 이 값이 갱신되지 않아
		# 150s로 남아있었다 - 정상 응답도 nginx가 먼저 504로 끊어버리는 원인이었다.
		proxy_read_timeout 320s;
	}
}
