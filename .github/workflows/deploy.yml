name: Deploy

# main에 머지되면 운영 서버(EC2)에 자동 배포한다. Actions 탭에서 수동 실행(Run workflow)도 가능.
# AWS 인증은 OIDC 임시 자격증명 - 저장소에 AWS 키를 두지 않는다.
# (IAM 역할 perfumery-github-deploy는 이 저장소의 main 브랜치에서만 사용할 수 있다)
on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::833116001801:role/perfumery-github-deploy
  INSTANCE_ID: i-06bdf00de51933d5d
  DEPLOY_BUCKET: perfumery-studio-deploy
  PUBLIC_HEALTH_URL: https://api.perfumery.studio/api/v1/actuator/health

jobs:
  deploy:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: perfumery_schema_check
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test (incl. Flyway schema check)
        env:
          SCHEMA_CHECK_DB_URL: jdbc:mysql://127.0.0.1:3306/perfumery_schema_check?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
          SCHEMA_CHECK_DB_USERNAME: root
          SCHEMA_CHECK_DB_PASSWORD: ci-only-password
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload release to S3
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-plain.jar$')
          REL="s3://${DEPLOY_BUCKET}/releases/${GITHUB_SHA}"
          aws s3 cp "$JAR" "${REL}/app.jar" --only-show-errors
          aws s3 cp deploy/ec2 "${REL}/ec2/" --recursive --only-show-errors

      - name: Deploy on EC2 (SSM)
        run: |
          REL="s3://${DEPLOY_BUCKET}/releases/${GITHUB_SHA}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 900 \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "commands=[\"aws s3 cp ${REL}/ec2/deploy.sh /tmp/perfumery-deploy.sh --only-show-errors --region ${AWS_REGION}\",\"bash /tmp/perfumery-deploy.sh ${GITHUB_SHA}\"]" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          STATUS=Pending
          for _ in $(seq 1 90); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done

          echo "----- server output -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text
          echo "status: $STATUS"
          [ "$STATUS" = "Success" ]

      - name: Public health check
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "$PUBLIC_HEALTH_URL"
